<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>德撲單局對練 · 可加注</title>
<style>
:root{
  --bg:#0f172a; --cardline:#1e293b; --name:#94a3b8; --ink:#e2e8f0; --felt:#14532d;
  --gold:#f5c518; --red:#ef4444; --blue:#3b82f6; --ok:#4ade80; --bad:#fca5a5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; color:var(--ink);
  min-height:100vh; background:
    radial-gradient(900px 500px at 50% -8%, #134e31 0%, transparent 60%),
    linear-gradient(180deg,#0b1220 0%,#111827 100%);}
.wrap{max-width:560px; margin:0 auto; padding:14px 13px 60px;}
nav{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
nav a{color:var(--name); text-decoration:none; font-size:12px; border:1px solid var(--cardline);
  border-radius:999px; padding:5px 12px;}
nav a.on{color:var(--gold); border-color:var(--gold);}
nav .sp{flex:1;}
header{display:flex; align-items:center; gap:10px;}
.logo2{width:40px;height:40px;border-radius:11px; background:linear-gradient(135deg,#f5c518,#f97316);
  display:flex;align-items:center;justify-content:center; font-size:20px; box-shadow:0 5px 16px rgba(245,197,24,.25);}
header h1{font-size:18px; margin:0;}
header .sub{font-size:12px; color:var(--name); margin-top:2px;}
.stats{display:flex; gap:8px; margin:10px 0;}
.chip{flex:1; background:rgba(255,255,255,.04); border:1px solid var(--cardline); border-radius:13px; padding:9px 10px;}
.chip b{display:block; font-size:16px;}
.chip span{font-size:11px; color:var(--name);}
.chip.gold b{color:var(--gold);}
.felt{background:linear-gradient(180deg,#155e3a,#0e4a2b); border:1px solid #177a45; border-radius:20px; padding:14px 12px; margin-top:8px;}
.felt h3{text-align:center; margin:0 0 8px; font-size:14px; color:#dcf5e5;}
.felth{text-align:center; font-size:11.5px; color:#a7d8b8; letter-spacing:.3px; margin-bottom:6px;}
.cards{display:flex; justify-content:center; gap:6px; min-height:60px;}
.pcard{width:44px; height:63px; border-radius:8px; background:#f3f4f6; color:#0f172a;
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800;
  box-shadow:0 3px 9px rgba(0,0,0,.35); font-size:16px;}
.pcard.red{color:#dc2626;}
.pcard .suit{font-size:15px}
.pcard.down{background:linear-gradient(135deg,#2563eb,#1e3a8a); color:rgba(255,255,255,.75); font-size:26px;}
.pcard.small{width:38px; height:54px; font-size:13px;}
.lab{text-align:center; font-size:11.5px; color:var(--name); margin:7px 0 4px;}
.pot{text-align:center; font-size:13px; color:#cfffd9; margin:8px 0 4px;}
.pot b{color:var(--gold); font-size:15px;}
.hintbox{background:rgba(37,99,235,.08); border:1px solid rgba(59,130,246,.35); border-radius:13px;
  padding:11px 13px; font-size:13px; line-height:1.75; margin-top:8px;}
.hintbox em{font-style:normal; color:#bfdbfe; display:block; margin-bottom:4px; font-weight:700;}
.hintbox .formula{font-family:ui-monospace,monospace; font-size:12px; background:rgba(0,0,0,.3);
  border-radius:6px; padding:2px 7px; margin:0 3px;}
.hintbox .ok{color:#86efac;} .hintbox .no{color:#fca5a5;}
.actions{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap;}
button{border:none; border-radius:12px; padding:14px 6px; font-size:15px; font-weight:800; cursor:pointer; color:#fff;}
button:disabled{opacity:.4; pointer-events:none;}
.btn-fold{background:#334155; flex:1;}
.btn-call{background:linear-gradient(135deg,#2563eb,#1d4ed8); flex:1;}
.btn-raise{background:linear-gradient(135deg,#16a34a,#15803d); flex:1;}
.btn-allin{background:linear-gradient(135deg,#dc2626,#b91c1c); flex:1;}
.raise-opts{display:flex; gap:8px; margin-top:8px;}
.raise-opts button{flex:1; font-size:13px; padding:11px 4px;}
.msg{text-align:center; font-size:13.5px; margin-top:12px; line-height:1.7;}
.msg b{color:var(--gold);}
.post{background:rgba(255,255,255,.04); border:1px solid var(--cardline); border-radius:16px; padding:13px; margin-top:13px;}
.post h3{margin:0 0 8px; font-size:15px;}
.post .rev{display:flex; justify-content:space-between; gap:12px; padding:8px 2px; border-top:1px solid rgba(255,255,255,.07);
  font-size:13px; line-height:1.6;}
.post .rev .l{color:var(--name); flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="index.html">📚 機率題庫</a>
    <a class="on" href="duel.html">⚔️ 單局對練</a>
    <span class="sp"></span>
  </nav>
  <header>
    <div class="logo2">⚔️</div>
    <div><h1>德撲單局對練 · 可加注</h1><div class="sub">跟 AI 完整來回加注，AI 會詐唬也會反加注</div></div>
  </header>
  <div class="stats">
    <div class="chip gold"><span>你的籌碼</span><b id="heroch"></b></div>
    <div class="chip"><span>底池</span><b id="potcho"></b></div>
    <div class="chip"><span>AI 籌碼</span><b id="aich"></b></div>
  </div>
  <div class="felt">
    <h3 id="streetlab"></h3>
    <div class="felth">AI 的手牌</div>
    <div class="cards" id="aiboard"></div>
    <div class="lab" id="ailab"></div>
    <div class="felth">公用牌</div>
    <div class="cards" id="comboard"></div>
    <div class="pot">底池 <b id="potv">0</b></div>
    <div class="felth">你的手牌</div>
    <div class="cards" id="herob"></div>
    <div id="hintbox"></div>
    <div id="controls"></div>
    <div id="raiseopts"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div id="post"></div>
</div>
<script src="multiplayer/game-core.js"></script>
<script src="duel.js"></script>
</body>
</html>
