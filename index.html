<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>德撲機率訓練 · 小艾</title>
<style>
  :root{
    --felt:#14532d; --felt2:#166534; --cardbg:#0f172a; --cardline:#334155;
    --gold:#f5c518; --red:#dc2626; --blue:#2563eb; --ok:#22c55e; --bad:#ef4444;
    --ink:#e2e8f0; --sub:#94a3b8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--ink); min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1d4ed8 0%, transparent 60%),
      linear-gradient(180deg,#0b1220 0%, #0f172a 100%);
  }
  .wrap{max-width:560px; margin:0 auto; padding:16px 14px 40px;}
  header{display:flex; align-items:center; gap:10px; margin:6px 2px 14px;}
  .logo{width:38px;height:38px;border-radius:10px; background:linear-gradient(135deg,#f5c518,#f97316);
    display:flex;align-items:center;justify-content:center; font-size:20px; box-shadow:0 4px 14px rgba(245,197,24,.3);}
  header h1{font-size:18px; margin:0; letter-spacing:.5px;}
  header .sub{font-size:12px;color:var(--sub); margin-top:2px;}
  .stats{display:flex; gap:8px; margin:0 2px 14px;}
  .stat{flex:1; background:rgba(255,255,255,.04); border:1px solid var(--cardline); border-radius:12px; padding:8px 10px;}
  .stat b{display:block; font-size:18px;}
  .stat span{font-size:11px;color:var(--sub);}
  .card{background:rgba(255,255,255,.05); border:1px solid var(--cardline); border-radius:16px; padding:16px; margin-bottom:14px;}
  .tag{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; margin-bottom:10px;}
  .tag.pd{background:rgba(34,197,94,.15); color:#4ade80;}
  .tag.od{background:rgba(37,99,235,.18); color:#7bb3ff;}
  .tag.dc{background:rgba(245,197,24,.15); color:var(--gold);}
  .tag.pk{background:rgba(192,132,252,.15); color:#d8b4fe;}
  .qbody{min-height:60px;}
  .q{font-size:17px; line-height:1.6; font-weight:600;}
  .board{display:flex; gap:6px; margin:14px 0 4px; flex-wrap:wrap;}
  .pcard{width:44px;height:62px;border-radius:7px; background:#fff; color:#111;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:800; font-size:14px; box-shadow:0 3px 8px rgba(0,0,0,.35);}
  .pcard.red{color:#dc2626;}
  .pcard .suit{font-size:18px;}
  .pot{font-size:13px;color:var(--sub); margin-top:8px;}
  .pot b{color:#fde047;}
  .opts{display:flex; flex-direction:column; gap:9px; margin-top:14px;}
  .opt{border:1px solid var(--cardline); background:rgba(255,255,255,.04); color:var(--ink);
    border-radius:12px; padding:13px 15px; font-size:15px; text-align:left; cursor:pointer;
    transition:transform .05s, background .15s;}
  .opt:active{transform:scale(.99);}
  .opt.correct{background:rgba(34,197,94,.16); border-color:var(--ok);}
  .opt.wrong{background:rgba(239,68,68,.12); border-color:var(--bad);}
  .opt.disabled{opacity:.55; pointer-events:none;}
  .explain{display:none; background:rgba(37,99,235,.08); border:1px solid rgba(59,130,246,.35);
    border-radius:12px; padding:12px 14px; margin-top:14px; font-size:14px; line-height:1.7;}
  .explain b{color:#7bb3ff;}
  .explain .formula{background:rgba(0,0,0,.25); border-radius:7px; padding:2px 8px; font-family:ui-monospace,monospace; font-size:13px; margin:0 2px;}
  .next{width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700;
    background:linear-gradient(135deg,#f5c518,#f97316); color:#1a1205; cursor:pointer; margin-top:14px;}
  .next:disabled{opacity:.5;}
  .result{display:none; text-align:center; padding:8px 0;}
  .result .big{font-size:44px; font-weight:800; margin:6px 0;}
  .result .big.ok{color:#4ade80;} .result .big.no{color:var(--bad);}
  .breakdown{margin-top:14px; text-align:left;}
  .row{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid rgba(255,255,255,.06); font-size:14px;}
  .row span:first-child{color:var(--sub);}
  .row b.ok{color:#4ade80;} .row b.no{color:var(--bad);}
  .home{text-align:center; padding:10px 0;}
  .home p{color:var(--sub); font-size:14px; line-height:1.7; margin:14px 8px;}
  .home .opts{margin-top:2px;}
  .start{display:block; width:100%; border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:800;
    background:linear-gradient(135deg,#f5c518,#f97316); color:#1a1205; cursor:pointer; margin-top:16px;}
  .ctag{display:flex; align-items:center; gap:10px; border:1px solid var(--cardline); background:rgba(255,255,255,.04);
    border-radius:12px; padding:12px 14px; margin-top:9px; cursor:pointer;}
  .ctag .dot{width:12px;height:12px;border-radius:50%; border:2px solid var(--sub);}
  .ctag.sel .dot{border-color:var(--gold); background:var(--gold); box-shadow:0 0 8px rgba(245,197,24,.6);}
  .ctag span{font-size:14px;}
  .hidden{display:none!important;}
  .muted{color:var(--sub);}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>

<script>
"use strict";
// ---------- 題庫生成器 ----------
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function clampr(x){return Math.max(Math.round(x),1);}

function fmtPct(v){ return Math.round(v*10)/10 + "%"; }

const TYPES = {
  pd:{name:"底池賠率", cls:"pd", desc:"用底池賠率算出「該有多少勝率才划算」"},
  od:{name:"補牌勝率", cls:"od", desc:"用補牌數（outs）推算勝率"},
  dc:{name:"決策判斷", cls:"dc", desc:"結合賠率與勝率，決定該跟還是該棄"},
  pk:{name:"機率知識", cls:"pk", desc:"起手牌的基本機率"}
};

function q_potodds(){
  // 底池賠率：求所需勝率門檻
  const combos=[
    {pot:100, call:50},{pot:120, call:40},{pot:80, call:20},{pot:50, call:50},
    {pot:240, call:60},{pot:150, call:30},{pot:90, call:30},{pot:200, call:50},
    {pot:300, call:50},{pot:160, call:40},{pot:120, call:60}
  ];
  const c=pick(combos);
  const ceil=(()=>{ // clean numbers
    if(c.call===50&&c.pot===50)return 50;
    if(c.call===40&&c.pot===120)return 25;
    if(c.call===20&&c.pot===80)return 20;
    if(c.call===60&&c.pot===240)return 20;
    if(c.call===30&&c.pot===150)return 16.7;
    if(c.call===30&&c.pot===90)return 25;
    if(c.call===50&&c.pot===200)return 20;
    return 33.3;
  })();
  const needed = c.call/(c.pot+c.call)*100;
  const opts = new Set([Math.round(needed*10)/10]);
  const cands=[needed+10,needed-10,needed+20,needed-20,needed+5,needed-5,33.3,16.7,25,50,10,40];
  for(const x of cands){ const v=Math.round(Math.max(x,1)*10)/10; if(v>0&&v<=100)opts.add(v); if(opts.size>=4)break;}
  const arr=[...opts]; while(arr.length>4) arr.splice(rnd(arr.length),1);
  // shuffle choices
  for(let i=arr.length-1;i>0;i--){const j=rnd(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}
  return {
    type:"pd", cat:"底池賠率",
    q:`底池有 ${c.pot}，對手下注後輪到你跟 ${c.call}。請問你至少需要多少勝率，跟注才是數學上划算的？`,
    opts:arr.map(o=>fmtPct(o)), ans:fmtPct(Math.round(needed*10)/10),
    board:null, pot: c.pot+(c.call/*we include opponent call*/),
    explain:`這是「底池賠率」題。你付出的叫「跟注額」，最後總底池 = 目前的底池 + 你跟的注。
價值的算法是：<span class="formula">所需勝率 = 跟注額 ÷ 總底池</span>
=${c.call} ÷ (${c.pot} + ${c.call}) = ${fmtPct(needed)}
也就是說，如果你手上的牌預期能贏 ${fmtPct(needed)} 以上的對局，長期跟注就是賺的；低於這個門檻就該棄牌。`
  };
}

function q_outs(){
  const outsNums=[4,6,8,9,12,15];
  const outs=pick(outsNums);
  const street=pick(["flop","turn"]);
  const equity = street==="flop" ? outs*4 : outs*2; // 二四法則
  const suitDesc = outs===9?"（買同花，9 張補牌）":outs===8?"（買花或兩頭順，8 張）":outs===4?"（買卡順，4 張補牌）":outs===6?"（兩張高張或兩組卡順，6 張）":outs===12?"（12 張，如帶兩張高張買花）":"";
  const handAsc = outs===9?"一副同花聽牌":outs===8?"同花或順子聽牌":outs===4?"卡順聽牌":outs===6?"兩組聽牌":outs===12?"強力聽牌":"聽牌";
  const opts=[]; const base=equity;
  const cands=[base,base+2,base-2,base+4,outs*3, Math.round(base*0.9),Math.round(base*1.1),base+8,base-8, 50,33];
  const set=new Set([base]);
  for(const x of cands){const v=Math.max(Math.round(x),1); if(v<=100)set.add(v); if(set.size>=4)break;}
  const arr=[...set];while(arr.length>4)arr.splice(rnd(arr.length),1);
  for(let i=arr.length-1;i>0;i--){const j=rnd(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}
  return {
    type:"od", cat:"補牌勝率",
    q:`翻牌後（${street==="flop"?"還有轉牌和河牌兩張牌":"此時已在轉牌，只剩河牌一張"}\uff09，你的${handAsc}有 ${outs} 張補牌${suitDesc}。用「二四法則」，你估計的勝率大約是？`,
    opts:arr.map(o=>o+"%"), ans:base+"%", board:null,
    explain:`「二四法則」是很實用的速算法：
· 翻牌之後（還有 2 張牌）：<span class="formula">勝率 ≈ 補牌數 × 4%</span> = ${outs} × 4% = ${outs*4}%
· 轉牌之後（只剩 1 張牌）：<span class="formula">勝率 ≈ 補牌數 × 2%</span> = ${outs} × 2% = ${outs*2}%
這題是 ${street==="flop"?"翻牌":"轉牌"}，所以答案是 ${base}%。
（提醒：二四法則在補牌多時會略高估，實戰很夠用，精準你要用組合數算。）`
  };
}

function q_decision(){
  const combos=[
    {pot:140, call:40, win:35, need:22.2},  // call
    {pot:200, call:100, win:25, need:33.3}, // fold
    {pot:80, call:20, win:20, need:20},     // edge, 20>=20 call (barely) -> make win 18
  ];
  const pool=[
    {pot:140, call:40, win:35, need:22.2, verdict:"call"},
    {pot:200, call:100, win:25, need:33.3, verdict:"fold"},
    {pot:80, call:30, win:18, need:27.3, verdict:"fold"},
    {pot:240, call:60, win:22, need:20, verdict:"call"},
    {pot:150, call:50, win:30, need:25, verdict:"call"},
    {pot:320, call:80, win:16, need:20, verdict:"fold"},
    {pot:180, call:20, win:12, need:10, verdict:"call"},
    {pot:250, call:50, win:18, need:16.7, verdict:"call"},
    {pot:300, call:100, win:20, need:25, verdict:"fold"},
    {pot:100, call:25, win:30, need:20, verdict:"call"},
  ];
  const c=pick(pool);
  const ok = (c.win >= c.need);
  const diff = Math.abs(c.win-c.need);
  return {
    type:"dc", cat:"決策判斷",
    q:`底池 ${c.pot}，對手下注，你要跟 ${c.call} 才能看下一張。根據讀牌，你估計自己約有 ${c.win}% 的勝率。這個「跟注」在數學上划算嗎？（所需門檻約 ${fmtPct(c.need)}）`,
    opts:["應該跟注（+EV）","應該棄牌（-EV）"],
    ans: ok?"應該跟注（+EV）":"應該棄牌（-EV）",
    board:null,
    explain:`先算出「所需勝率門檻」：<span class="formula">所需勝率 = 跟注額 ÷ 總底池</span> = ${c.call} ÷ ${c.pot+c.call} ≈ ${fmtPct(c.need)}
再拿它和你估計的勝率比：
· 你估計勝率 ${c.win}% ${ok?"≥":"<"} 門檻 ${fmtPct(c.need)} → ${ok?"跟注是正期望值（+EV），長期賺":"跟注是負期望值（-EV），長期虧"}
所以正確答案是：<b>${ok?"跟注":"棄牌"}</b>。
（差距 ${fmtPct(diff)}，${diff<=3?"這題算邊緣，實戰還要考慮隱含賠率與你的位置":"判定很明確"}。）`
  };
}

function q_prob(){
  const bank=[
    {q:"拿到任一特定口袋對（例如 AA）的機率約？」", a:"0.45% (約 221:1)", opts:["0.45% (約 221:1)","5.9% (約 16:1)","1.7% (約 58:1)","0.09% (約 1000:1)"], e:"每種特定對只對應 6 種組合，共 1326 種起手組合。6 ÷ 1326 ≈ 0.45%，也就是約 221 手才會拿到一次 AA。"},
    {q:"拿到「任意口袋對」（不管哪一組）的機率約？」", a:"5.9% (約 17:1)", opts:["5.9% (約 17:1)","0.45% (約 221:1)","11.8% (約 8:1)","2.4% (約 41:1)"], e:"共有 13 種對子 × 6 種組合 = 78 組合。78 ÷ 1326 ≈ 5.9%，約 1/17。也就是平均 17 手就有一手口袋對。"},
    {q:"拿到「任兩張同花」的機率約？」", a:"23.5%", opts:["23.5%","10.9%","16.7%","31.4%"], e:"第一張任意，第二張要和它同花色：剩 51 張中有 12 張同色。12 ÷ 51 ≈ 23.5%。" },
    {q:"拿到「AK」（無論同花 AKs 或不同花 AKo，只要是一張 A 一張 K）的機率約？」", a:"1.2% (約 82:1)", opts:["1.2% (約 82:1)","0.9% (約 110:1)","2.4% (約 41:1)","3.6% (約 27:1)"], e:"AK 有 4×4=16 種組合（含同花 AKs 4 種）。16 ÷ 1326 ≈ 1.2%。"},
    {q:"翻牌「買同花（9 張補牌）在河牌前擊中」的機率約？」", a:"35%", opts:["35%","19%","24%","41%"], e:"9 張補牌、兩張牌可來，用補牌法約 9×4=36%，精算約 35%。所以你拿聽牌跟注時，大約三分之一機會會擊中。"},
    {q:"口袋對在翻牌中形成「三條（set）」的機率約？」", a:"11.8% (約 1/8.5)", opts:["11.8% (約 1/8.5)","23.5% (約 1/4)","5.9% (約 1/17)","2.4% (約 1/42)"], e:"你有口袋對，需要在翻牌三張中出現一張同點數（2 張補牌）。精算約 11.8%，也就是平均約 8.5 次翻牌才中一次 set。"},
    {q:"你拿到「至少一張 A」的機率約？」", a:"14.9% (約 1/7)", opts:["14.9% (約 1/7)","7.5% (約 1/13)","20% (約 1/5)","10.9% (約 1/9)"], e:"用「一張 A 都沒有」反算：(48/52)×(47/51) ≈ 0.851，所以至少一張 A = 1 − 0.851 ≈ 14.9%。"},
    {q:"口袋對（如 QQ）對上兩張較大的高張（如 AK）翻牌前全下，勝率約？」", a:"約 55%", opts:["約 55%","約 35%","約 70%","約 45%"], e:"口袋對對上兩張不同點數的高張，通常約 55% 優勢（高張若同花會再拉近）。大致抓「對 vs 高張 ≈ 55:45」就夠用。"},
    {q:"你兩張起手不同點數，翻牌時「至少湊到一對」的機率約？」", a:"32.4% (約 1/3)", opts:["32.4% (約 1/3)","24% (約 1/4)","40% (約 2/5)","16% (約 1/6)"], e:"你手上兩張點數不同，共 6 張補牌。翻牌三張都沒中 = C(44,3)/C(50,3) ≈ 67.6%，所以至少中一對 ≈ 32.4%。"},
    {q:"拿到「AA 或 KK」的機率約？」", a:"0.9% (約 110:1)", opts:["0.9% (約 110:1)","0.45% (約 221:1)","1.2% (約 82:1)","0.3% (約 332:1)"], e:"AA 有 6 種組合、KK 也有 6 種，合計 12 種 ÷ 1326 ≈ 0.9%，也就是約 110 手才一次。"}
  ];
  const c=pick(bank);
  let opts=c.opts.slice(); for(let i=opts.length-1;i>0;i--){const j=rnd(i+1);[opts[i],opts[j]]=[opts[j],opts[i]];}
  return {type:"pk", cat:"機率知識", q:c.q, opts, ans:c.a, board:null, explain:c.e};
}

const CAT_MAP={pd:q_potodds, od:q_outs, dc:q_decision, pk:q_prob};

// ---------- 狀態 ----------
let cats=null;         // 選中的分類
let queue=[];          // 本回合題目
let qi=0;              // 當前題號(0-based)
let cur=null;          // 當前題目
let score=0;           // 答對數
let byCat={};          // 各分類統計
let answered=false;

const ROUND=10;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function genQueue(){
  const chosen = cats ? shuffle(cats) : shuffle(Object.keys(CAT_MAP));
  // 帶權重讓各分類都有出現
  const pool=[];
  for(let i=0;i<ROUND;i++){
    const c=chosen[i%chosen.length];
    pool.push(c);
  }
  pool.sort(()=>Math.random()-0.5);
  // 抽題去重：同一回合不重複出題；同分類題庫窮盡後才允許重複
  const seen=new Set();   // 已用題目 key（type|q），跨分類共用
  queue=[];
  for(const c of pool){
    let q=null, attempts=0;
        do{
          q=CAT_MAP[c]();
          attempts++;
        }while(seen.has(q.type+"|"+q.q) && attempts<1000);
    seen.add(q.type+"|"+q.q);
    queue.push(q);
  }
  qi=0;
}

function render(){
  const w=document.getElementById("wrap");
  w.innerHTML="";
  if(!cats){ renderHome(w); return;}
  if(qi>=queue.length){ renderResult(w); return;}
  renderQuestion(w);
}

function renderHome(w){
  w.innerHTML=`
  <nav style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
    <a href="index.html" style="color:var(--gold);text-decoration:none;font-size:13px;border:1px solid var(--gold);border-radius:999px;padding:5px 12px">📚 機率題庫</a>
    <a href="duel.html" style="color:var(--sub);text-decoration:none;font-size:13px;border:1px solid var(--cardline);border-radius:999px;padding:5px 12px">⚔️ 單局對練</a>
    <a href="teaching.html" style="color:var(--sub);text-decoration:none;font-size:13px;border:1px solid var(--cardline);border-radius:999px;padding:5px 12px">🎓 教學實戰</a>
  </nav>
  <header><div class="logo">♠</div><div><h1>德撲機率訓練</h1><div class="sub">教學型題庫 · 小艾幫你打底</div></div></header>
  <div class="card home">
    <div class="q" style="font-size:16px">選一個練習範圍（可複選），每回合 10 題：</div>
    <div id="ctags"></div>
    <button class="start" onclick="startGame()">開始練習</button>
  </div>`;
  const host=w.querySelector("#ctags");
  const order=["pd","od","dc","pk"];
  for(const k of order){
    const t=TYPES[k];
    const d=document.createElement("div");
    d.className="ctag sel"; d.dataset.k=k;
    d.innerHTML=`<span class="dot"></span><span><b>${t.name}</b> — ${t.desc}</span>`;
    d.onclick=()=>{ d.classList.toggle("sel"); };
    host.appendChild(d);
  }
}

function startGame(){
  cats=[...document.querySelectorAll(".ctag.sel")].map(e=>e.dataset.k);
  if(cats.length===0){alert("請至少選一個練習範圍");return;}
  score=0; byCat={}; answered=false;
  genQueue(); render();
}

function renderQuestion(w){
  cur=queue[qi];
  const t=TYPES[cur.type];
  const num=qi+1;
  let boardHtml="";
  if(cur.board && cur.board.length){
    boardHtml=`<div class="board">${cur.board.map(c=>{
      const r=/[♠♣]/.test(c[1]||"")?"black":"red";
      return `<div class="pcard ${r}"><span>${c[0]}</span><span class="suit">${c[1]}</span></div>`;
    }).join("")}</div>`;
  }
  const potHtml = cur.pot?`<div class="pot">總底池 <b>${cur.pot}</b></div>`:"";
  const byKey=cur.type;
  byCat[byKey]={seen:(byCat[byKey]?.seen||0)+1, right:byCat[byKey]?.right||0};
  w.innerHTML=`
  <header><div class="logo">♠</div><div><h1>德撲機率訓練</h1><div class="sub">第 ${num} / ${ROUND} 題</div></div></header>
  <div class="stats">
    <div class="stat"><b>${score}</b><span>答對</span></div>
    <div class="stat"><b>${qi}</b><span>已答</span></div>
    <div class="stat"><b>${ROUND-qi}</b><span>剩餘</span></div>
  </div>
  <div class="card">
    <span class="tag ${t.cls}">${t.name}</span>
    <div class="qbody">
      <div class="q">${cur.q}</div>
      ${boardHtml}
      ${potHtml}
    </div>
    <div class="opts" id="opts">${cur.opts.map((o,i)=>`<div class="opt" data-i="${i}" onclick="answer(${i})">${optionLabel(o)}</div>`).join("")}</div>
    <div class="explain" id="ex"></div>
    <button class="next" id="next" onclick="nextQ()">下一題 →</button>
  </div>`;
  document.getElementById("next").disabled=true;
}

function optionLabel(o){
  // 單選表符前綴
  return `<span style="display:inline-block;width:22px"></span>${o}`;
}

function answer(i){
  if(answered)return;
  answered=true;
  const ok = cur.opts[i]===cur.ans;
  if(ok){score++; byCat[cur.type].right++;}
  const opts=document.querySelectorAll(".opt");
  opts.forEach((o,idx)=>{
    o.classList.add("disabled");
    if(cur.opts[idx]===cur.ans)o.classList.add("correct");
    else if(idx===i)o.classList.add("wrong");
  });
  const ex=document.getElementById("ex");
  ex.style.display="block";
  ex.innerHTML=`<div style="margin-bottom:6px">${ok?'<b style="color:#4ade80">✔ 答對了！</b>':'<b style="color:#ef4444">✘ 答錯了</b>'}</div>${cur.explain}`;
  document.getElementById("next").disabled=false;
}

function nextQ(){ qi++; answered=false; render(); }

function renderResult(w){
  const pct=Math.round(score/ROUND*100);
  const good=pct>=80;
  let breakdown="";
  const order=["pd","od","dc","pk"];
  let maxMiss=0, weakCat=null;
  for(const k of order){
    const s=byCat[k]; if(!s)continue;
    const miss=s.seen-s.right;
    if(miss>maxMiss){maxMiss=miss; weakCat=k;}
    let col="ok",txt="全對";
    if(miss>0){col="no"; txt=`錯 ${miss} 題`;}
    breakdown+=`<div class="row"><span>${TYPES[k].name}</span><b class="${col}">${s.right}/${s.seen} ${txt}</b></div>`;
  }
  const advice = weakCat && maxMiss>0
    ? `<div style="margin-top:14px;padding:11px 13px;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.35);border-radius:12px;font-size:13px;line-height:1.6">📌 你的弱項是「${TYPES[weakCat].name}」— 錯 ${maxMiss} 題。建議先回這個分類多練幾回合，把觀念補起來再進綜合。</div>`:"";
  w.innerHTML=`
  <header><div class="logo">♠</div><div><h1>德撲機率訓練</h1><div class="sub">練習結果</div></div></header>
  <div class="card result" style="display:block">
    <div class="muted">本回合 ${ROUND} 題</div>
    <div class="big ${good?'ok':'no'}">${score}/${ROUND}</div>
    <div class="muted">正確率 ${pct}%</div>
    ${good?'<div style="color:#4ade80;margin-top:6px">很穩，觀念正確 🎉</div>':'<div style="color:#f59e0b;margin-top:6px">再多練幾次，把弱項補起來 💪</div>'}
    <div class="breakdown">${breakdown}</div>
    ${advice}
    <button class="next" onclick="restart()" style="margin-top:18px">再練一回合</button>
    <button class="next" onclick="changeRange()" style="background:linear-gradient(135deg,#334155,#1e293b);color:#e2e8f0;margin-top:10px">更換練習範圍</button>
  </div>`;
}

function restart(){ genQueue(); score=0; byCat={}; answered=false; render(); }
function changeRange(){ cats=null; score=0; byCat={}; render(); }

render();
</script>
</body>
</html>
