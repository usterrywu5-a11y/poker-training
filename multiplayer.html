<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>德撲多人版 · 好友房</title>
<style>
:root{
  --bg:#0f172a; --cardline:#1e293b; --name:#94a3b8; --ink:#e2e8f0; --felt:#14532d;
  --gold:#f5c518; --red:#ef4444; --blue:#3b82f6; --ok:#4ade80; --bad:#fca5a5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif; color:var(--ink);
  min-height:100vh; background:
    radial-gradient(900px 500px at 50% -8%, #134e31 0%, transparent 60%),
    linear-gradient(180deg,#0b1220 0%,#111827 100%);}
.wrap{max-width:640px; margin:0 auto; padding:14px 13px 60px;}
nav{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
nav a{color:var(--name); text-decoration:none; font-size:12px; border:1px solid var(--cardline);
  border-radius:999px; padding:5px 12px;}
nav a.on{color:var(--gold); border-color:var(--gold);}
nav .sp{flex:1;}
header{display:flex; align-items:center; gap:10px;}
.logo2{width:40px;height:40px;border-radius:11px; background:linear-gradient(135deg,#f5c518,#f97316);
  display:flex;align-items:center;justify-content:center; font-size:20px; box-shadow:0 5px 16px rgba(245,197,24,.25);}
header h1{font-size:18px; margin:0;}
header .sub{font-size:12px; color:var(--name); margin-top:2px;}

/* 大廳 */
.lobby{background:rgba(255,255,255,.04); border:1px solid var(--cardline); border-radius:16px; padding:16px; margin-top:12px;}
.lobby h2{margin:0 0 12px; font-size:15px;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:12px; color:var(--name); margin-bottom:4px;}
.field input, .field select{width:100%; padding:10px; border-radius:10px; border:1px solid var(--cardline);
  background:#0b1220; color:var(--ink); font-size:14px;}
.row{display:flex; gap:8px;}
.row .field{flex:1;}
.btn{flex:1; border:none; border-radius:12px; padding:13px 6px; font-size:15px; font-weight:800; cursor:pointer; color:#fff;}
.btn-primary{background:linear-gradient(135deg,#f5c518,#f97316); color:#0f172a;}
.btn-ghost{background:#334155;}
.btn:disabled{opacity:.4; pointer-events:none;}
.roomcode{text-align:center; font-size:13px; color:var(--name); margin-top:10px;}
.roomcode b{color:var(--gold); font-size:18px; letter-spacing:2px;}

/* 牌桌 */
.felt{background:linear-gradient(180deg,#155e3a,#0e4a2b); border:1px solid #177a45; border-radius:20px; padding:14px 12px; margin-top:8px; display:none;}
.felt h3{text-align:center; margin:0 0 8px; font-size:14px; color:#dcf5e5;}
.felth{text-align:center; font-size:11.5px; color:#a7d8b8; letter-spacing:.3px; margin-bottom:6px;}
.cards{display:flex; justify-content:center; gap:6px; min-height:60px;}
.pcard{width:44px; height:63px; border-radius:8px; background:#f3f4f6; color:#0f172a;
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800;
  box-shadow:0 3px 9px rgba(0,0,0,.35); font-size:16px;}
.pcard.red{color:#dc2626;}
.pcard .suit{font-size:15px}
.pcard.down{background:linear-gradient(135deg,#2563eb,#1e3a8a); color:rgba(255,255,255,.75); font-size:26px;}
.pcard.small{width:34px; height:48px; font-size:12px;}
.pot{text-align:center; font-size:13px; color:#cfffd9; margin:8px 0 4px;}
.pot b{color:var(--gold); font-size:15px;}

/* 玩家列 */
.players{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
.prow{display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.25); border:1px solid rgba(255,255,255,.08);
  border-radius:12px; padding:8px 10px;}
.prow.me{border-color:var(--gold);}
.prow .pname{flex:1; font-size:13px; font-weight:700;}
.prow .pname small{display:block; font-size:10.5px; color:var(--name); font-weight:400;}
.prow .pchips{font-size:13px; color:var(--gold);}
.prow .pbet{font-size:12px; color:#a7d8b8; min-width:52px; text-align:right;}
.prow .pstatus{font-size:11px; color:var(--bad); min-width:40px; text-align:right;}
.prow .pstatus.act{color:var(--gold);}
.prow .pstatus.ok{color:var(--ok);}
.prow .pcards{display:flex; gap:3px;}

.actions{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap;}
button{border:none; border-radius:12px; padding:14px 6px; font-size:15px; font-weight:800; cursor:pointer; color:#fff;}
button:disabled{opacity:.4; pointer-events:none;}
.bet-input{flex:1; min-width:90px; border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:8px 12px;
  font-size:15px; font-weight:700; background:rgba(0,0,0,.3); color:#fff; text-align:center; outline:none;}
.bet-input:focus{border-color:var(--gold);}
.prow .phand{font-size:11px; color:var(--gold); min-width:48px; text-align:right; font-weight:700;}
.btn-fold{background:#334155; flex:1;}
.btn-call{background:linear-gradient(135deg,#2563eb,#1d4ed8); flex:1;}
.btn-raise{background:linear-gradient(135deg,#16a34a,#15803d); flex:1;}
.btn-allin{background:linear-gradient(135deg,#dc2626,#b91c1c); flex:1;}
.msg{text-align:center; font-size:13.5px; margin-top:12px; line-height:1.7;}
.msg b{color:var(--gold);}
.log{background:rgba(255,255,255,.04); border:1px solid var(--cardline); border-radius:12px; padding:10px; margin-top:10px;
  font-size:12px; color:var(--name); max-height:120px; overflow-y:auto;}
.log div{padding:2px 0; border-top:1px solid rgba(255,255,255,.05);}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="index.html">📚 機率題庫</a>
    <a href="duel.html">⚔️ 單局對練</a>
    <a class="on" href="multiplayer.html">👥 多人對戰</a>
    <a href="teaching.html">🎓 教學實戰</a>
    <span class="sp"></span>
  </nav>
  <header>
    <div class="logo2">👥</div>
    <div><h1>德撲多人版 · 好友房</h1><div class="sub">2-4 人即時對戰，房主開局、房號加入</div></div>
  </header>

  <!-- 大廳 -->
  <div class="lobby" id="lobby">
    <h2>建立或加入房間</h2>
    <div class="row">
      <div class="field"><label>你的暱稱</label><input id="name" value="玩家" maxlength="12"></div>
    </div>
    <div class="row">
      <div class="field"><label>人數上限</label><select id="maxPlayers"><option>2</option><option selected>3</option><option>4</option></select></div>
      <div class="field"><label>起始籌碼</label><select id="startStack"><option>500</option><option selected>1000</option><option>2000</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>盲注等級</label><select id="blinds"><option value="5,10">5/10</option><option value="10,20" selected>10/20</option><option value="25,50">25/50</option></select></div>
      <div class="field"><label>房號（加入用）</label><input id="roomCode" placeholder="4 位房號" maxlength="4"></div>
    </div>
    <div class="airow" style="margin:2px 0 12px">
      <label style="font-size:13px;color:var(--name);display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="aiFill" checked style="width:16px;height:16px;accent-color:#f5c518">
        人數不足時由 AI 補位 <span style="color:#a7d8b8;font-size:11px">（找不到真人也能立即開局）</span>
      </label>
    </div>
    <div class="row">
      <button class="btn btn-primary" onclick="createRoom()">建立房間</button>
      <button class="btn btn-ghost" onclick="joinRoom()">加入房間</button>
    </div>
    <div class="roomcode" id="roomcodeBox" style="display:none">房號：<b id="roomcodeVal"></b><br><span style="font-size:11px">把房號告訴朋友即可加入</span></div>
  </div>

  <!-- 牌桌 -->
  <div class="felt" id="felt">
    <h3 id="streetlab">等待開局</h3>
    <div class="felth">公用牌</div>
    <div class="cards" id="comboard"></div>
    <div class="pot">底池 <b id="potv">0</b></div>
    <div class="players" id="players"></div>
    <div class="actions" id="controls"></div>
    <div class="msg" id="msg"></div>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
// ==================== 連線 ====================
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/';
let ws = null, token = null, mySeat = -1, isOwner = false, roomCode = null;
let state = null;
let nextAt = 0, cdT = null;   // 下一局倒數

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    if (token) ws.send(JSON.stringify({ type: 'resume', token }));
  };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => {
    log('連線中斷，嘗試重連…');
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function handle(m) {
  switch (m.type) {
    case 'joined':
      token = m.token; mySeat = m.seat; isOwner = m.isOwner; roomCode = m.roomCode;
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('felt').style.display = 'block';
      document.getElementById('roomcodeBox').style.display = 'block';
      document.getElementById('roomcodeVal').textContent = m.roomCode;
      log('已加入房間 ' + m.roomCode + (m.isOwner ? '（你是房主）' : ''));
      break;
    case 'state':
      state = m;
      if (m.event && m.event.type === 'nextHandCountdown') nextAt = Date.now() + (m.event.ms | 0);
      if (m.phase === 'roundEnd') {
        if (!nextAt) nextAt = Date.now() + 20000; // 未收到倒數時以預設 20 秒兜底
        startCD();
      } else {
        nextAt = 0; clearInterval(cdT); cdT = null;
      }
      render();
      break;
    case 'error':
      showError(m.message);
      break;
  }
}

// ==================== 渲染 ====================
const SUITC = ['♠','♥','♦','♣'];
const RANKC = ['A','2','3','4','5','6','7','8','9','T','J','Q','K'];
const STREETN = ['翻牌前','翻牌','轉牌','河牌','攤牌'];
function cardEl(c, small) {
  const s = c.slice(-1), r = c.slice(0, -1);
  const suit = SUITC.indexOf(s), red = suit === 1 || suit === 2;
  return `<div class="pcard ${red?'red':''} ${small?'small':''}">${r}<span class="suit">${s}</span></div>`;
}
function cardBack(small) { return `<div class="pcard down ${small?'small':''}">?</div>`; }

function render() {
  if (!state) return;
  const s = state;
  // 每個新狀態清除上一張的錯誤/結果訊息（P2：錯誤跨回合同步清除）
  document.getElementById('msg').innerHTML = '';
  document.getElementById('streetlab').textContent =
    s.phase === 'roundEnd' ? '本局結束' : (STREETN[s.street] || '');
  document.getElementById('potv').textContent = s.pot;
  document.getElementById('comboard').innerHTML =
    s.board.map(c => cardEl(c)).join('') || '<span class="mark" style="color:#a7d8b8;font-size:12px">等待發牌</span>';

  // 玩家列
  const pl = s.players.map(p => {
    const isMe = p.seat === mySeat;
    const isAct = s.toActSeat === p.seat;
    let status = '';
    if (p.eliminated) status = '<span class="pstatus">淘汰</span>';
    else if (p.folded) status = '<span class="pstatus">蓋牌</span>';
    else if (p.allin) status = '<span class="pstatus ok">全下</span>';
    else if (isAct) status = '<span class="pstatus act">行動中</span>';
    else if (!p.connected) status = '<span class="pstatus">離線</span>';
    let cards = '';
    if (isMe) cards = p.hole.map(c => cardEl(c, true)).join('');
    else if (p.revealed && !p.folded) cards = p.hole.map(c => cardEl(c, true)).join('');
    else if (!p.folded && !p.eliminated) cards = cardBack(true) + cardBack(true);
    const hand = p.revealed && p.handName ? `<div class="phand">${p.handName}</div>` : '';
    return `<div class="prow ${isMe?'me':''}">
      <div class="pname">${p.name}${isMe?'（你）':''}${p.isOwner?' 👑':''}<small>${p.seat===s.dealerSeat?'莊':''}${p.seat===s.smallBlindSeat?'小盲':''}${p.seat===s.bigBlindSeat?'大盲':''}</small></div>
      <div class="pcards">${cards}</div>
      <div class="pchips">${p.stack}</div>
      <div class="pbet">${p.bet>0?'下注 '+p.bet:''}</div>
      ${hand}
      ${status}
    </div>`;
  }).join('');
  document.getElementById('players').innerHTML = pl;

  // 控制
  let c = '';
  if (s.phase === 'betting' && s.toActSeat === mySeat) {
    const me = s.players[mySeat];
    const need = s.currentBet - me.bet;
    const canOpen = s.currentBet <= 0; // 本街無人下注 → 可開池下注
    const defAmt = canOpen ? (s.bigBlind || 0) : (s.currentBet + (s.bigBlind || 0)); // 預設金額
    c += `<button class="btn-fold" onclick="doAct('fold')">棄牌</button>`;
    c += `<button class="btn-call" onclick="doAct('${need>0?'call':'check'}')">${need>0?('跟注 '+need):'過牌'}</button>`;
    c += `<input class="bet-input" id="betAmt" type="number" min="1" placeholder="金額" value="${defAmt||''}">`;
    c += `<button class="btn-raise" onclick="doBet()">${canOpen?'下注':'加注'}</button>`;
    c += `<button class="btn-allin" onclick="doAct('allin')">全下</button>`;
  } else if (s.phase === 'betting') {
    c = `<div style="flex:1;text-align:center;color:#a7d8b8;font-size:13px">等待其他玩家…</div>`;
  } else if (s.phase === 'roundEnd') {
    const w = s.winners.map(w => s.players[w.seat]);
    const desc = w.map(x => `${x.name}${x.handName ? '（'+x.handName+'）' : ''}`).join('、');
    c = `<div style="flex:1;text-align:center;color:var(--gold);font-size:14px">🏆 ${desc} 贏得底池</div>
      <button class="btn btn-primary" style="flex:1;margin-top:6px" onclick="nextHand()">下一局 ▶ <span id="cd" style="opacity:.75;font-size:13px"></span></button>
      <div style="flex:1;text-align:center;color:#a7d8b8;font-size:12px">按下立即開始，或 ${Math.ceil(NEXT_DEFAULT_MS/1000)} 秒後自動開局</div>`;
  }
  document.getElementById('controls').innerHTML = c;

  // 房主開局按鈕
  if (isOwner && s.phase === 'waiting') {
    document.getElementById('controls').innerHTML =
      `<button class="btn btn-primary" style="flex:1" onclick="startGame()">開始遊戲</button>`;
  }
}

function doAct(action) { send({ type: 'act', action }); }
function doBet() {
  const el = document.getElementById('betAmt');
  if (!el) return;
  const amt = Math.round(Number(el.value));
  if (!amt || amt <= 0) { showError('請輸入有效的下注金額'); return; }
  const canOpen = state.currentBet <= 0;
  send({ type: 'act', action: canOpen ? 'bet' : 'raise', amount: amt });
}
function showError(msg) {
  const m = document.getElementById('msg');
  if (m) { m.innerHTML = `<span style="color:var(--bad)">⚠ ${msg}</span>`; }
  log('⚠ ' + msg);
}
function startGame() { send({ type: 'start' }); }

const NEXT_DEFAULT_MS = 20000; // 與 server 端 NEXT_HAND_DELAY 同步（兜底顯示）
function nextHand() { send({ type: 'nextHand' }); }
function startCD() {
  if (cdT) clearInterval(cdT);
  cdT = setInterval(cdTick, 250);
  cdTick();
}
function cdTick() {
  const el = document.getElementById('cd');
  if (!el) return;
  const left = nextAt ? Math.max(0, Math.ceil((nextAt - Date.now()) / 1000)) : 0;
  el.textContent = left ? left + 's' : '';
}
function createRoom() {
  const [sb, bb] = document.getElementById('blinds').value.split(',').map(Number);
  send({ type: 'createRoom', name: document.getElementById('name').value || '房主',
    maxPlayers: +document.getElementById('maxPlayers').value,
    startStack: +document.getElementById('startStack').value, smallBlind: sb, bigBlind: bb,
    aiFill: document.getElementById('aiFill').checked });
}
function joinRoom() {
  send({ type: 'joinRoom', roomCode: document.getElementById('roomCode').value.trim().toUpperCase(),
    name: document.getElementById('name').value || '玩家' });
}

function log(t) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  d.textContent = t;
  el.prepend(d);
}

connect();
</script>
</body>
</html>
